name: Casambi MQTT Bridge (experimental)
version: "0.2.10-haos.2"
slug: casambi_bridge
description: Opt-in native Bluetooth bridge with a read-only preflight mode
url: https://github.com/kaikkone4/casambi-mqtt
arch:
  - aarch64
startup: application
boot: auto
watchdog: "http://[HOST]:[PORT:8099]/supervisor-health"
timeout: 30
host_dbus: true
host_network: false
init: true
apparmor: true
options:
  mode: disabled
  env: ""
  recovery_reset_generation: 0
schema:
  mode: list(disabled|preflight|bridge)
  env: password
  recovery_reset_generation: int(0,1000000)
