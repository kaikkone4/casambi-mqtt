name: "Lint"

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  ruff:
    name: "Ruff"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v7.0.1"

        - name: "Set up Python"
          uses: actions/setup-python@v7.0.0
          with:
            python-version: "3.13"
            cache: "pip"

        - name: "Install bridge runtime and test requirements"
          run: python3 -m pip install -r requirements-server.txt -r requirements-dev.txt

        - name: "Run bridge unit tests"
          run: pytest -q tests/test_server.py tests/test_switch_decoder.py tests/test_bridge_lifecycle.py tests/test_bridge_health.py

        - name: "Syntax check"
          run: python3 -m py_compile server.py

        - name: "Lint"
          run: python3 -m ruff check .

        - name: "Format"
          run: python3 -m ruff format . --check

  home-assistant:
    name: "Home Assistant ${{ matrix.core }} component tests"
    runs-on: "ubuntu-latest"
    env:
      PYTHON_DOTENV_DISABLED: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: "2026.8.2"
            requirements: "requirements-test.txt"
          - core: "2026.10.4"
            requirements: "requirements-test-production.txt"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v7.0.1"

        - name: "Set up Python"
          uses: actions/setup-python@v7.0.0
          with:
            python-version: "3.14"
            cache: "pip"
            cache-dependency-path: "${{ matrix.requirements }}"

        - name: "Run Home Assistant component tests"
          run: |
            python3 -m pip install -r "${{ matrix.requirements }}"
            pytest -q tests/test_light.py tests/test_integration.py tests/test_migration.py tests/test_switch_events.py tests/test_device_trigger_discovery.py tests/test_target_trigger_discovery.py tests/test_health.py tests/test_recovery.py tests/test_sensor.py -o asyncio_mode=auto
